<style>
:root{--bg:#fff7ef;--bg2:#ffe3cc;--card:rgba(255,255,255,.88);--text:#2b1d14;--muted:#7a6759;--primary:#e8590c;--primary2:#ff922b;--onprimary:#fff;--ok:#d3f5db;--okb:#2f9e44;--ko:#fde1de;--kob:#e03131;--border:#f0dfd0;--shadow:0 8px 24px rgba(232,89,12,.18);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f0b;--bg2:#2e1a11;--card:rgba(44,32,26,.88);--text:#f6ece4;--muted:#bfaea1;--primary:#ff8a4c;--primary2:#ffb067;--onprimary:#2a1200;--ok:#1d4a2a;--okb:#51cf66;--ko:#55231f;--kob:#ff6b6b;--border:#3f3029;--shadow:0 8px 24px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg:#150f0b;--bg2:#2e1a11;--card:rgba(44,32,26,.88);--text:#f6ece4;--muted:#bfaea1;--primary:#ff8a4c;--primary2:#ffb067;--onprimary:#2a1200;--ok:#1d4a2a;--okb:#51cf66;--ko:#55231f;--kob:#ff6b6b;--border:#3f3029;--shadow:0 8px 24px rgba(0,0,0,.45)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);background-image:linear-gradient(165deg,var(--bg) 0%,var(--bg2) 100%);background-attachment:fixed;color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;min-height:100vh;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:14px}
#app>*{animation:pop .35s both}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hero{text-align:center;padding-top:18px}
.logo{display:block;width:96px;height:96px;margin:0 auto 10px;border-radius:26px;box-shadow:var(--shadow)}
h1{font-size:2.4rem;line-height:1.1;margin:6px 0;font-weight:900;background:linear-gradient(90deg,var(--primary),var(--primary2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:1.35rem;line-height:1.3;margin:6px 0 16px}
.sub{margin:0;font-size:1.05rem;color:var(--muted)}
.foot,small,.top{color:var(--muted)}.foot{text-align:center;margin:0;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:16px;box-shadow:var(--shadow);backdrop-filter:blur(6px)}
.lvl-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}.lvl-top strong{flex:1}
.badge{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary2));color:var(--onprimary);display:grid;place-items:center;font-weight:800;font-size:1.1rem;box-shadow:var(--shadow)}
.bar{height:12px;border-radius:10px;background:var(--border);overflow:hidden;margin-bottom:6px}
.fill{height:100%;border-radius:10px;background:linear-gradient(90deg,var(--primary),var(--primary2));transition:width .5s}
.top{display:flex;align-items:center;gap:8px;font-weight:600}.top span:first-child{flex:1}
.chip{background:var(--card);border:1px solid var(--border);border-radius:999px;padding:3px 12px;color:var(--text)}
.qbar{height:6px;border-radius:6px;background:var(--border);overflow:hidden}.qbar div{height:100%;background:var(--okb);transition:width .4s}
.spacer{flex:1}
.btn{width:100%;padding:17px;border:0;border-radius:18px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:var(--onprimary);font-size:1.15rem;font-weight:800;cursor:pointer;box-shadow:var(--shadow)}
.btn:active{transform:scale(.98)}
.btn.alt{background:transparent;color:var(--primary);border:2px solid var(--primary);box-shadow:none}
#next{position:sticky;bottom:12px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-bottom:10px;padding:13px 14px;border-radius:16px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1rem;cursor:pointer;transition:transform .1s,border-color .2s}
.opt:active:not(:disabled){transform:scale(.98);border-color:var(--primary)}
.let{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:800;background:var(--border);color:var(--text)}
.opt.ok{background:var(--ok);border-color:var(--okb)}.opt.ok .let{background:var(--okb);color:#fff}
.opt.ko{background:var(--ko);border-color:var(--kob)}.opt.ko .let{background:var(--kob);color:#fff}
.opt.ok::after{content:"✓";margin-left:auto;font-weight:900;color:var(--okb)}
.opt.ko::after{content:"✗";margin-left:auto;font-weight:900;color:var(--kob)}
.opt:disabled{cursor:default;opacity:1}
.fb{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 14px}
.fb p{margin:6px 0 0}.up{margin-top:6px;font-weight:800;color:var(--primary)}
.ring{width:176px;height:176px;border-radius:50%;margin:6px auto;display:grid;place-items:center;background:conic-gradient(var(--primary) calc(var(--p)*1%),var(--border) 0);box-shadow:var(--shadow)}
.ring>div{width:142px;height:142px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:2.8rem;font-weight:900}
.center{text-align:center;margin:0}
</style>
</head>

const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let xp = Number(LS.get('cq_xp', 0)) || 0;
let seen = new Set(LS.get('cq_seen', []));
const TITLES = ['Débutant','Curieux','Explorateur','Connaisseur','Savant','Érudit','Maître','Sage','Légende'];
const xpForLevel = n => 50 * n * (n - 1);
const levelFromXp = x => { let l = 1; while (x >= xpForLevel(l + 1)) l++; return l; };
const title = l => TITLES[Math.min(l - 1, TITLES.length - 1)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save = () => { LS.set('cq_xp', xp); LS.set('cq_seen', [...seen]); };
const qid = q => { let h = 0x811c9dc5; for (let i = 0; i < q.text.length; i++) { h ^= q.text.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16); };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function pick(count) {
  let pool = Q.filter(q => !seen.has(qid(q)));
  if (pool.length < count * 3) { seen.clear(); pool = Q.slice(); }
  const by = {};
  pool.forEach(q => (by[q.category] = by[q.category] || []).push(q));
  Object.values(by).forEach(shuffle);
  const out = []; let last = null;
  while (out.length < count) {
    let cats = Object.keys(by).filter(c => by[c].length);
    if (!cats.length) break;
    if (cats.length > 1 && last) cats = cats.filter(c => c !== last);
    const c = cats[Math.floor(Math.random() * cats.length)];
    out.push(by[c].pop()); last = c;
  }
  return out;
}

function levelBar() {
  const l = levelFromXp(xp), a = xpForLevel(l), b = xpForLevel(l + 1);
  const pct = Math.round((xp - a) / (b - a) * 100);
  return `<div class="lvl"><div class="lvl-top"><span class="badge">${l}</span><strong>Niveau ${l} · ${title(l)}</strong><span>${xp} XP</span></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div><small>${b - xp} XP avant le niveau ${l + 1}</small></div>`;

function startGame() {
  g = { qs: pick(10), i: 0, score: 0, streak: 0, best: 0, gained: 0, startXp: xp, sel: null, gain: 0, up: null };
  quiz();
}

function quiz() {
  const q = g.qs[g.i], n = g.qs.length, answered = g.sel !== null;
  const L = ['A', 'B', 'C', 'D'];
  const opts = q.options.map((o, i) => {
    let c = 'opt';
    if (answered) { if (i === q.answer) c += ' ok'; else if (i === g.sel) c += ' ko'; }
    return `<button class="${c}" data-i="${i}" ${answered ? 'disabled' : ''}><span class="let">${L[i]}</span><span>${esc(o)}</span></button>`;
  }).join('');
  let fb = '';
  if (answered) {
    const good = g.sel === q.answer;
    fb = `<div class="fb"><strong>${good ? 'Bonne réponse ! +' + g.gain + ' XP 🎉' : 'Raté !'}</strong>${g.up ? '<div class="up">Niveau supérieur ! Tu passes au niveau ' + g.up + ' · ' + title(g.up) + ' 🏆</div>' : ''}<p>${esc(q.explanation)}</p></div>`;
  }
  const pct = Math.round((g.i + (answered ? 1 : 0)) / n * 100);
  app.innerHTML = `<div class="top"><span>Question ${g.i + 1} / ${n}</span><span class="chip">⭐ ${g.score}</span><span class="chip">🔥 ${g.streak}</span></div><div class="qbar"><div style="width:${pct}%"></div></div><div class="card">${levelBar()}</div><div><h2>${esc(q.text)}</h2>${opts}${fb}</div>${answered ? `<button class="btn" id="next">${g.i + 1 >= n ? 'Voir le résultat' : 'Suivant'}</button>` : ''}`;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(Number(b.dataset.i)));
  const nx = document.getElementById('next');
  if (nx) nx.onclick = next;
}

function choose(i) {
  if (g.sel !== null) return;
  const q = g.qs[g.i], old = levelFromXp(xp);
  g.sel = i; seen.add(qid(q));
  if (i === q.answer) {
    g.score++; g.streak++; g.best = Math.max(g.best, g.streak);
    g.gain = 10 + (g.streak >= 3 ? 5 : 0); xp += g.gain; g.gained += g.gain;
    const nl = levelFromXp(xp); if (nl > old) g.up = nl;
  } else { g.streak = 0; g.gain = 0; }
  save(); quiz();
}

function next() {
  if (g.i + 1 >= g.qs.length) return result();
  g.i++; g.sel = null; g.gain = 0; g.up = null; quiz(); window.scrollTo(0, 0);
}

function result() {
  const n = g.qs.length, r = g.score / n;
  const msg = r === 1 ? '🎉 Parfait ! Tu es un vrai puits de science' : r >= 0.7 ? 'Excellent travail 👏' : r >= 0.4 ? 'Pas mal, continue comme ça 💪' : 'Courage, la prochaine fois sera meilleure 🌱';
  const nl = levelFromXp(xp), ol = levelFromXp(g.startXp);
  app.innerHTML = `<div class="spacer"></div><div class="ring" style="--p:${Math.round(r * 100)}"><div>${g.score}/${n}</div></div><p class="center"><strong>${msg}</strong></p><p class="center">+${g.gained} XP · Meilleure série : ${g.best} 🔥</p>${nl > ol ? '<p class="center up">Niveau supérieur ! Tu es maintenant niveau ' + nl + ' · ' + title(nl) + ' 🏆</p>' : ''}<div class="card">${levelBar()}</div><div class="spacer"></div><button class="btn" id="again">Rejouer</button><button class="btn alt" id="home">Retour à l’accueil</button>`;
  document.getElementById('again').onclick = startGame;
  document.getElementById('home').onclick = home;
  window.scrollTo(0, 0);
}

home();
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
</script>
</body>
</html>
